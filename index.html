CT0.length=0;CT0.push('No princípio havia apenas o Silêncio. Então oito luzes se acenderam no escuro e, juntas, tornaram-se o Coração de Aetheria.','Sete deuses, os Regentes, juraram guardá-lo. Cada um deu um pedaço de si para que o Silêncio jamais escapasse.','Você e Lyra chegaram ali ainda crianças, trazidos pelo Rio de Estrelas. Todas as noites ela cantava a mesma canção, só para você.','Mas à beira do Abismo um olho roxo se abriu no céu. Uma figura coroada, feita de sombra e silêncio, surgiu diante dos dois irmãos.','A figura prendeu você num cristal do sono. Antes que o gelo cobrisse seus olhos, você viu Lyra ser levada para dentro da escuridão.','Mil anos passaram. Os reinos esqueceram, os Regentes enlouqueceram sob coroas de sombra e a Ordem do Olho Roxo cobriu o céu.','Mas uma fagulha de luz recusou-se a desistir de você. O cristal rachou e a Aurora, enfim, tocou o seu rosto.','Oito reinos. Oito fragmentos. Um rastro azul que só você sabe seguir. Acorde, viajante: está na hora de trazer a sua irmã de volta.');

const mi=(a,b,w)=>{MIDC[w]=[[a,b],[40+w,47]]};
mi('Eos ergue-se em luz, livre da coroa de geleia. Ao fundo, a Aurora volta a nascer sobre as Planícies pela primeira vez em mil anos.','No chão brilha uma pegada azul. Lyra esteve aqui. A Fagulha já voa à frente, apontando para o deserto.',0);
mi('Ammon rasga o contrato que o prendia e a areia se acalma. O fragmento flutua até a sua mão, quente como um coração.','Na duna há uma pena de cristal ainda morna. Lyra deixou uma pista... ou um pedido de desculpas.',1);
mi('No fragmento da Rainha há uma memória: Lyra, ainda livre, lê um pergaminho e descobre o que o Coração faz a cada século. Ela chora e jura que ninguém mais será sacrificado.','Pendurada num galho, uma pena de cristal repete a canção de ninar. Foi assim que começou a sombra do Imperador.',2);
mi('Ymir quebra as correntes de gelo e a tundra inteira respira. O dragão sobe aos céus, rasgando a aurora boreal.','Entre os cristais, um bilhete na letra de Lyra: "Perdão por não ter esperado". Quatro Regentes livres, quatro ainda por salvar.',3);

const ARR={1:[['Além das Planícies, as Dunas Eternas guardam a cidade de Zafira. Seu Regente, Ammon, selava contratos com a própria alma. Desde a coroa roxa, só cobra dívidas impagáveis.','O vento traz areia e um sussurro: a mesma canção. Lyra passou por aqui, e o rastro dela parece carregar um pedido de perdão.'],[61,61]],
2:[['Mais ao sul, a Floresta de Sylva guarda raízes tão antigas quanto o Coração. A Rainha das Aranhas já foi a bibliotecária dos deuses; suas teias guardam toda memória de Aetheria.','Hoje as teias prendem quem entra. Em algum ponto entre as raízes, Lyra deixou uma pergunta para ser encontrada.'],[62,62]],
3:[['No extremo norte, a Tundra de Ymir esfria há mil invernos. O dragão-regente guardava as portas do inverno para que o gelo nunca engolisse o mundo.','Agora o gelo engole tudo. Na neve, pegadas se afastam sem pressa: Lyra caminhava com tristeza, não com medo.'],[63,63]],
4:[['O Pântano de Hydrea era um lago de águas curativas onde os reinos vinham sarar. A Hidra-regente cuidava de cada ferido sem pedir nada em troca.','A coroa envenenou a cura: as águas adoecem quem bebe. Mesmo assim, uma flor de cristal brota onde Lyra pisou.'],[64,64]],
5:[['Acima das nuvens flutuam as ilhas de Zéfiro, onde o vento nunca teve dono. O Titã das Tempestades guardava as rotas entre todos os reinos.','Sem ele, as ilhas se afastam uma a uma. Você salta de pedra em pedra, seguindo a trilha azul rumo à próxima tempestade.'],[65,65]],
6:[['Sob o vulcão, a Forja de Ignar criou as armas que defenderam Aetheria. O Senhor das Chamas só aceitava um pagamento: honra.','A coroa roubou a honra dele, e a forja só produz cinzas. No fundo da caverna, uma sombra sorri e desaparece.'],[66,66]],
7:[['Além do último reino o chão simplesmente acaba. No Abismo Cósmico o Coração é um sol negro, e os fragmentos que você carrega queimam em resposta.','No centro há um trono. A figura coroada que o prendeu mil anos atrás levanta o olhar e canta, baixinho, a canção de ninar.','Você reconhece a voz antes de reconhecer o rosto.'],[67,67,67]]};
const lore=(w,t,v)=>{MIDC[w][0].push(t);MIDC[w][1].push(v)};
lore(1,'Nos primeiros dias, os sete deuses firmaram o Pacto com o Coração: paz para todos os reinos em troca de uma única vida a cada século, sorteada entre os povos. Com o tempo, o sorteio virou lenda e a dívida foi esquecida.',70);
lore(2,'Lyra encontrou esse segredo escondido na biblioteca da Rainha. Releu o pergaminho a noite toda, sem acordar você. Quando o sol nasceu, ela já tinha tomado uma decisão.',72);
lore(3,'Do gelo emergem os caçadores da Ordem do Olho Roxo. Eles adoram o Silêncio e colocam coroas de sombra nos Regentes, prometendo o fim da dor, e cobrando o fim da vontade.',71);
lore(4,'Você se lembra de uma noite na Ponte de Estrelas. Lyra prendeu o dedo mínimo no seu e prometeu: "Se um dia eu me perder, siga a canção. Eu sempre volto por você."',73);
lore(5,'Cem anos antes de vocês chegarem, o último sorteio levou uma menina do vilarejo. O Coração pulsou, satisfeito. Lyra viu tudo, escondida atrás de um muro, e nunca mais foi a mesma.',74);
lore(6,'No Abismo, uma figura encapuzada contempla o Coração. Segura uma coroa e sussurra a canção de ninar para o vazio. "Só mais um século", ela repete. "Falta pouco."',75);

dlg:{
pro:[{sc:'crystal'},'Narração|Madrugada. A hora em que o mundo respira baixinho e até as estrelas parecem pedir silêncio.','Narração|Dizem que, a essa hora, os mortos caminham pelos campos sussurrando nomes esquecidos. Você nunca acreditou em fantasmas.','Narração|Mas há uma voz presa dentro do cristal, e ela não é de ninguém que morreu. É de alguém que ainda espera.','Narração|Há um som antes da luz: uma canção de ninar, desafinada pelo tempo.','Narração|O cristal do sono racha em silêncio. Mil anos de escuridão escorrem como água.',{sc:'dawn'},'Narração|Primeiro vem o frio. Depois, o cheiro de terra molhada. Depois, o coração, batendo outra vez, teimoso, como quem se recusa a terminar.','Narração|Não é sonho. Não é lembrança. Desta vez, você acorda de verdade.','Narração|E no horizonte a aurora se abre devagar, dourada como uma promessa que alguém guardou só para você.','Fagulha|Ai! Cuidado com a cabeça! Você acordou! Eu nunca achei que fosse conseguir!','{h}|...Onde está Lyra?','Fagulha|Não sei. Sou só uma fagulha do cristal que prendia você. Mas sei o nome dela: você o repetiu mil anos, dormindo.',{c:[['Preciso encontrá-la. Agora.',[{set:{tom:'c'}},'Fagulha|Coragem demais quebra mais rápido que a espada, mas gosto disso. Vou na frente!']],['Quem é você, de verdade?',[{set:{tom:'a'}},'Fagulha|Boa pergunta. Descobrimos juntos? Prometo não mentir... muito.']],['Obrigado por me acordar.',[{set:{tom:'g'}},'Fagulha|Ninguém nunca agradeceu a uma fagulha. Fico com a luz mais quente por isso.']]]},{sc:'vila'},'Narração|Ao longe, uma vila de telhados vermelhos e cheiro de pão. Um mundo que continuou sem você.','Fagulha|Aldão guarda a vila. Ele vende, forja e sabe de tudo. Vá falar com ele.',{fx:()=>qStart('m1')}],
tshop:[{sc:'shop'},'Aldão|Primeira vez na minha loja? Deixe eu explicar. É simples, juro.','Aldão|🧪 Poção: 25 de ouro. Cura 40% da sua vida. E descansar aqui na vila é de graça!','Aldão|⚒️ Forja: 8 minérios mais ouro viram +1 na sua arma. Cave as pedras com a picareta para juntar minério.','Aldão|💰 Vender: troco minério e madeira por ouro. 🔮 Patch misterioso: um amuleto aleatório, do Comum ao Divino. Quanto mais raro, melhor!','Aldão|📜 E se eu pedir minério numa missão, é só entregar aqui. Boa sorte, herói!'],
aldao1:['{h}|Aldão? A Fagulha disse que o senhor sabe de tudo.','Aldão|Sei o bastante para ter medo. Mil anos sem ninguém pelo Rio de Estrelas, e agora o céu tem um olho roxo que nunca pisca.',{k:'tom',v:'c',l:'Aldão|Seus olhos têm pressa, rapaz. Gosto disso. Gosto menos do que a pressa faz com os imprudentes.'},{k:'tom',v:'a',l:'Aldão|Perguntador, hein? Ótimo. Quem pergunta menos, morre mais.'},{k:'tom',v:'g',fx:()=>{P.pots++},l:'Aldão|E educado! Tome uma poção por conta da casa.'},'Aldão|Uma estrela roxa caiu nos campos. Os slimes, antes mansos, viraram feras. Procure pistas pela estrada: algo caiu junto.','Aldão|E olhe o mapa na parede da loja: tem um buraco que ninguém explica. Sempre esteve ali... acho.'],
carta_ok:['Fagulha|Lyra esteve aqui, ou alguém quer que acreditemos nisso. Vamos limpar os campos dos slimes. Eles guardam o resto da pista.'],
slime_ok:['Fagulha|Eles pararam de brilhar em roxo... A estrela os deixou. Ysolde, a guardiã de histórias, mora atrás da vila. Ela deve saber mais.'],
ys1:['Ysolde|Então é você. O garoto do cristal do sono. Minha avó falava de você como se fosse uma canção.','Ysolde|Os Regentes não são deuses, criança. São guardiões que juraram. A primeira foi Eos, a Aurora. Hoje veste uma coroa de geleia e esqueceu o próprio nome.',{c:[['Vou libertá-la.',[{set:{eos:'l'}},'Ysolde|Coragem vale pouco sem cuidado. Mas Eos precisa de quem acredite nela.']],['E se ela não quiser ser libertada?',[{set:{eos:'d'}},'Ysolde|...Boa pergunta. Poucos perguntariam. Ouça antes de golpear.']]]},'Ysolde|Quando o Rei Slime tremer, escute. A coroa fala com quem tem a canção de Lyra.'],
ysE:['Ysolde|Ainda não é hora, viajante. Siga as pistas da estrada e volte.'],
ys3:['Ysolde|Guardo um livro para quem tem a canção: Cânticos da Aurora. Caiu da minha carroça na estrada dos campos. Quer procurá-lo?',{c:[['Eu o trago.',[{fx:()=>qStart('ysq')},'Ysolde|Procure um brilho de livro perto da estrada.']],['Agora não.',['Ysolde|O livro espera. Eu também.']]]}],
ysW:['Ysolde|O livro está na estrada dos campos. Procure um brilho de papel.'],
ys4:['Ysolde|Os Cânticos! Leia a página queimada, viajante... Fagulha, esta é para você.','Fagulha|Dizer que sou feita de amor é bonito. Mas e se eu for só... um eco de alguém?',{c:[['Você é minha amiga, não importa a origem.',[{set:{fag:'a'}},'Fagulha|...Então não importa. Já gosto de quem eu sou.']],['Vamos descobrir o que isso significa.',[{set:{fag:'q'}},'Fagulha|Sempre prático. Mas você tem razão: a verdade vai aparecer. No Capítulo 4, talvez.']]]}],
ysD:['Ysolde|Vá com cuidado, herói. As canções estão do seu lado.'],
mira0:['Mira|Um viajante! Meu forno apagou quando a estrela caiu e os slimes comeram minha lenha. Traz 3 minérios de brasa das pedras?',{c:[['Claro, eu cavo.',[{fx:()=>qStart('mira')},'Mira|Obrigada! Uso brasa de pedra para acender o forno velho.']],['Agora não posso.',['Mira|Sem pressa. O forno e eu somos pacientes.']]]}],
miraW:['Mira|Ainda faltam minérios? Pedras brilhantes cintilam perto das colinas. Use a picareta.'],
mira2:['Mira|O forno acendeu! Tome: pão de aurora, receita da minha avó.',{k:'tom',v:'g',l:'Mira|Você tem olhos gentis, sabia? Faz mais bem que o pão.'},{c:[['Dividir o pão com a Fagulha.',[{set:{mira:'d'}},'Fagulha|Eu não como... mas o gesto aquece.']],['Guardar para a estrada.',[{set:{mira:'g'},fx:()=>{P.pots++}},'Mira|Sábio. Pão ajuda depois de uma boa luta.']]]}],
miraD:['Mira|O forno nunca mais apagou. Volte sempre!'],
tob0:['Tobias|Psiu! Eu desenho mapas, mas as estrelas no meu mapa não batem com o céu. Acho que há marcos de pedra formando um desenho. Acha 2 marcos para mim?',{c:[['Eu procuro.',[{fx:()=>qStart('tobias')},'Tobias|Eles ficam perto da estrada, um de cada lado!']],['Outro dia.',['Tobias|Eu espero... e desenho.']]]}],
tobW:['Tobias|Já achou os marcos? Fique de olho nas pedras com marcas na estrada.'],
tob2:[{sc:'mapa'},'Tobias|Ligando os dois marcos... é um olho! O olho roxo está desenhado no chão da planície inteira, e a pupila fica bem onde a estrela caiu.','Fagulha|Alguém desenhou isso antes de o Vazio chegar. Alguém sabia.',{c:[['Vamos guardar segredo por enquanto.',[{set:{tob:'s'}},'Tobias|Certo. Eu guardo no mapa, ninguém lê meus rabiscos.']],['Conte à vila.',[{set:{tob:'v'}},'Tobias|Vou avisar o Aldão! Quem sabe a vila se prepara.']]]}],
tobD:['Tobias|Meu mapa está quase pronto. Obrigado, herói!'],
bossIn:[{sc:'slime'},'Narração|O trono treme. Geleia roxa escorre dos degraus e uma coroa de cristal gira sobre um olho que não é dele.','Rei Slime|Blub... quem... quem canta? Alguém canta... Aurora?',{k:'eos',v:'l',l:'Fagulha|Ele sofre, {h}. A coroa o controla. Liberte-o!'},{k:'eos',v:'d',l:'Fagulha|Você perguntou se ela quer ser libertada. Descubra agora.'},'Fagulha|Ele vem! Cuidado com os saltos!'],
bossOut:[{sc:'eos'},'Narração|A coroa racha e a geleia se desfaz em luz. Uma mulher feita de manhã se ergue onde o rei caiu.','Eos|Eu... me lembrava de uma canção. Era a sua?',{c:[['Preciso do seu fragmento do Coração.',[{set:{frag:'t'},fx:()=>{P.gold+=200;gainXp(80);try{addP(rollP(2))}catch(e){}}},'Eos|Leve. A Aurora confia em quem pede. Mas o Coração cobra a cada fragmento.']],['Fique com ele, Eos. Você o guardou por mil anos.',[{set:{frag:'l',eosAl:1}},'Eos|Então eu guardo, e me lembro. Em troca, ouça: sua irmã passou pelas dunas. Cuidado com os contratos de Ammon.']]]},'Eos|Pegadas de luz azul apontam para o deserto. Vá, e perdoe a Aurora.','Fagulha|Eu senti algo quando ela falou. Como uma lembrança que não é minha...'],
c1end:[{sc:'dawn'},'Narração|Fim do Capítulo 1: Planícies de Aurora.',{k:'frag',v:'l',l:'Narração|Eos guarda o fragmento e lembra o seu nome. Ela será aliada nos capítulos futuros.'},{k:'frag',v:'t',l:'Narração|Você leva o fragmento de Eos. O Coração fica mais completo... e mais faminto.'},'Narração|Capítulo 2, Dunas Sussurrantes: a estrada está aberta, mas essa história ainda será escrita (planejado).',{fx:()=>{N().cap=2;sv();setTimeout(()=>play('lyra1'),500)}}],
lyra1:[{sc:'rio'},'Narração|Interlúdio de Lyra: agora você é ela. O jogador vê o que o herói não vê.',{sc:'lyra'},'Lyra|Mil anos de portas fechadas e o Coração ainda canta a nossa canção. O arquivo dos Regentes está atrás desta porta.',{sc:'vazio'},'Olho Roxo|Você chegou tão longe sozinha, pequena guardiã. Posso abrir a porta e mostrar o que os Regentes juraram esconder.','Olho Roxo|Só peço uma coisa: olhe para mim sem desviar.',{c:[['Olhar sem medo. Preciso da verdade.',[{fx:()=>cor(35)},'Lyra|(Meus olhos ardem. A porta se abre e eu leio a primeira linha do pacto.)',{fx:()=>{N().sd.s9=1}}]],['Olhar só por um instante.',[{fx:()=>cor(15)},'Lyra|(Vejo só um pedaço: uma frase queimada. Basta para continuar.)']],['Recusar e arrombar a porta sozinha.',[{fx:()=>cor(5)},'Lyra|(A porta resiste. Perco horas, mas o meu olhar continua meu.)']]]},{sc:'lyra'},'Narração|Uma marca roxa nasce na palma da mão de Lyra, quente como brasa.',{c:[['Esconder a marca do meu irmão.',[{set:{marca:'e'},fx:()=>cor(10)},'Lyra|(Ele já carrega o peso de me procurar. Não vou dar mais um.)']],['Deixar um bilhete para ele.',[{set:{marca:'b'}},'Lyra|(Escrevo na pedra: não confie na minha letra se a tinta estiver errada.)']]]},{fx:()=>{N().sd.s8=1;bn('Corrupção de Lyra',(N().cor|0)+'%');sv()}},'Narração|A corrupção de Lyra aparece no Diário e vai mudar os reencontros com ela nos capítulos futuros (planejado).'],
tbag:[{sc:'bag'},'Aldão|🎒 A mochila (botão no topo) tem 4 abas: Itens, Patches, Missões e Árvore.','Aldão|Patches são amuletos de raridade Comum a Divino. Equipe até 6 para ganhar bônus de dano, vida, crítico e mais.'],
ttree:[{sc:'tree'},'Aldão|🌳 Cada nível dá 1 ponto de habilidade. A árvore da sua classe tem 3 ramos: Combate, Mobilidade e Sobrevivência.','Aldão|Cada nó exige o anterior liberado. Gaste os pontos na aba Árvore da mochila.'],
tmapa:[{sc:'mapa'},'Aldão|🗺️ O mapa (botão no topo) mostra teleportes ◆, chefe ☠, missões ❗ e baús 📦.','Aldão|Chegue perto de um teleporte para ativá-lo. Depois toque no ◆ azul para voltar a ele. Não funciona na luta com chefe!'],
tgacha:[{sc:'gacha'},'Aldão|🎁 As Moedas Estelares 🪙 giram o banner: ×1 custa 1 moeda, ×10 custa 10.','Aldão|A garantia de personagem 5★ vem aos 90 giros e a de 4★ a cada 10. Dá para trocar ouro por moedas lá dentro.']

{n:'Hakim',x:90,y:-50,c:'#c89a4a',h:'#222',em:'🏜️',p:'O vento carrega areia e sussurros. Ao longe, uma tumba dourada espera.',pf:'As dunas falam baixinho. Acho que dizem o seu nome.',

 l1:['Pedra do contrato','«Todo pacto tem preço. O de Aetheria foi pago com uma vida a cada cem anos.»','Uma vida por século... Para que o Coração precisa delas?'],l2:['Pena de cristal','Uma pena azul e fria. Ao tocá-la, você ouve Lyra: «Não confie em quem cobra dívidas dos mortos.»','Foi isto que ela deixou. E o cheiro de chuva... igual ao do mapa apagado.'],
 k:'As múmias obedecem a um contrato roxo, não ao Faraó. Há outra mão por trás disto.',m:{a:['A pedra e a pena dizem o mesmo: Ammon foi forçado a assinar algo novo, e o novo contrato o prende.'],c2:[['Vou libertá-lo, não destruí-lo.','Leve a esperança. Pesa menos que a espada e vale mais.'],['Se ele resistir, eu o detenho.','Faça o que for preciso. Mas lembre: ele foi um bom guardião.']],z:['A tumba fica ao fim da estrada. Que as dunas sejam gentis.']},
 bi:['Faraó Eterno|Quem ousa... quebrar... o contrato? A palavra... não é... minha...','Fagulha|A voz dele treme. Alguém o obriga!'],bo:['Narração|O sarcófago racha e a areia dourada sobe em espiral. A coroa roxa se parte no ar.','Ammon|Assinei para salvar um povo e vendi a minha alma. Leve este fragmento, {h}.','Ammon|Sua irmã seguiu para o verde, onde as árvores sussurram. Procure o bosque.'],nx:'Floresta Sombria'},
{n:'Mirelle',x:90,y:-50,c:'#4a9a5a',h:'#6a3a1a',em:'🌲',p:'As árvores se fecham sobre o céu. Cada galho parece ouvir os seus passos.',pf:'Eu sinto olhos na copa. Olhos antigos, mas não maus.',
 a:['As árvores avisaram que você vinha. Elas não gostam de visitas, mas gostaram de você.'],c2:[['Elas falam com você?','Falam com todos. Poucos têm paciência para escutar.'],['Preciso passar, não conversar.','Então ande devagar. Pressa assusta as raízes.']],z:['Sylva, a Regente da Floresta, guarda um segredo do Coração. Ela cala desde que as teias tomaram o bosque.','Procure o que as raízes guardaram perto da estrada e limpe as aranhas do caminho.'],
 l1:['Raiz que escreve','As raízes formam letras: «O Coração se alimenta de uma vida por século. Sylva escolheu a dela.»','Ela se ofereceu? Então o pacto não foi roubo... foi sacrifício.'],l2:['Folha de Lyra','Uma folha dobrada com a letra de Lyra: «Sylva sabe o que o Coração é. Pergunte a ela, mas esteja pronto.»','Lyra confia nela. Isso me deixa mais preocupada, não menos.'],
 k:'As aranhas fiam teias roxas. O Vazio as ensinou a tecer.',m:{a:['Sylva se entregou ao Coração para mantê-lo vivo. Agora o Vazio usa a dor dela contra a floresta.'],c2:[['Vou trazê-la de volta.','Ela vai querer ficar. Mas pergunte do mesmo jeito.'],['Se o sacrifício a prende, eu o quebro.','Cuidado: quebrá-lo pode custar o Coração inteiro.']],z:['O ninho da Rainha fica no fim das teias. Leve luz.']},
 bi:['Rainha Aracnídea|Eu... era... Sylva... Tantas vidas... em meu nome...','Fagulha|Ela chora entre as presas. Não é fúria, é culpa!'],bo:['Narração|As teias se desfazem em pétalas. Uma mulher de casca e folhas ajoelha onde a rainha caiu.','Sylva|Cem anos de uma vida por vez... eu quis que fosse a última. Leve o fragmento, {h}.','Sylva|Procure o frio. Ymir ainda tem as correntes que o Imperador forjou.']  ,nx:'Tundra Glacial'},
{n:'Bjorn',x:90,y:-50,c:'#6a8ac8',h:'#d8d8d8',em:'❄️',p:'O vento corta como lâmina. No horizonte, runas roxas brilham dentro do gelo.',pf:'Essas runas não são deste mundo. Parecem... olhos fechados.',
 a:['Mais um viajante sem casaco! Entre, aqueça as mãos. Está procurando o quê?'],c2:[['A Regente deste vale.','Ymir? Está preso. Há meses ninguém ouve a voz dele.'],['Uma menina chamada Lyra.','Ela passou há pouco, tremendo. Perguntou das runas e foi atrás delas.']],z:['As runas roxas surgiram numa só noite e acorrentaram Ymir no coração da caverna.','Estude as runas da passagem. Se entendermos o desenho, talvez saibamos quebrá-lo.'],
 l1:['Runa da passagem','Um círculo roxo gravado no gelo: «Aqui jaz o primeiro nome do Imperador.»','Primeiro nome? Então ele já teve outro... antes de ser Imperador.'],l2:['Runa partida','Uma segunda runa, rachada: «Ele foi um Regente. O oitavo. O que ninguém lembra.»','O oitavo Regente... o reino apagado dos mapas!'],
 k:'Os golems têm runas no peito. Quem as quebra ouve um choro baixinho.',m:{a:['Entendi o desenho: as correntes de Ymir foram feitas com a dor de um Regente esquecido. Quebrá-las dói em dois.'],c2:[['Quebre-as comigo, vamos juntos.','Coragem de ferro. Que o gelo nos proteja.'],['Primeiro quero a verdade sobre o oitavo Regente.','Honesto como o inverno. Ymir deve saber mais.']],z:['A caverna do dragão fica ao fim da passagem. Volte vivo.']},
 bi:['Dragão de Gelo|Quebrem... as correntes... antes que ele... acorde de novo...','Fagulha|Ele implora, {h}! O gelo é a prisão, não a vontade dele!'],bo:['Narração|O gelo estala e uma aurora azul escorre pelas paredes. As correntes roxas caem em pó.','Ymir|Mil invernos calado... Leve o fragmento, {h}. E ouça: o Imperador já foi um de nós.','Ymir|Siga para o pântano. Hydrea conhece a canção que ele ainda canta dormindo.'],nx:'Pântano Venenoso'},
{n:'Zuma',x:90,y:-50,c:'#8a6a9a',h:'#9a9a9a',em:'🐸',p:'A névoa é doce e o chão afunda. Uma canção de ninar ecoa entre as palafitas.',pf:'Essa melodia... eu já ouvi. Eu não deveria conhecer essa melodia.',
 a:['Psiu, criança do cristal. Fale baixo: a névoa escuta e leva as palavras para o outro lado.'],c2:[['Quem canta aquela canção?','A canção canta a si mesma, desde que Hydrea adoeceu.'],['Vim ajudar, não assustar.','Então já é o primeiro visitante com bom coração em anos.']],z:['A Regente das águas enlouqueceu de tristeza. A canção que ela repete é a mesma que o Imperador sussurra.','Procure as lembranças deixadas nas palafitas e acalme os bichos que a névoa envenenou.'],
 l1:['Diário de palafita','«A canção de ninar veio de uma mãe que perdeu o filho. Hydrea a aprendeu para consolá-lo.»','Consolar quem? O Imperador foi um filho?'],l2:['Concha que canta','Ao ouvir a concha, a voz de Lyra se mistura com a canção: «É a mesma melodia, irmão. Ela vem de nós.»','De nós? Aren, você e Lyra... a canção é de vocês dois.'],
 k:'Os bichos estão doentes, não furiosos. A névoa roxa os adoeceu.',m:{a:['A canção é uma chave. Se alguém a cantar até o fim diante de Hydrea, talvez ela se lembre de quem é.'],c2:[['Eu canto, mesmo sem lembrar a letra.','A letra é só o começo. O coração faz o resto.'],['Prefiro deixar a Fagulha cantar.','Ela vai tentar. Mas dói mais quando a voz é emprestada.']],z:['O covil da Hidra fica no fundo do lodaçal. Respire fundo antes de entrar.']},
 bi:['Hidra do Lodo|Meu menino... onde... está o meu menino?','Fagulha|Ela não quer lutar. Quer só encontrar quem perdeu!'],bo:['Narração|As cabeças da hidra se dissolvem em água clara e uma figura de luz azul pousa na margem.','Hydrea|Aquela canção... eu a cantava para um menino de olhos roxos. Leve o fragmento, {h}.','Hydrea|Sua irmã foi para o céu, onde o vento guarda uma flor de cristal. Procure Zéfiro.']  ,nx:'Ilhas Celestes'},
{n:'Pip',x:90,y:-50,c:'#e8c84a',h:'#4a2a1a',em:'☁️',p:'Você pisa numa ponte de vento. Lá embaixo, o mundo é só um tapete verde.',pf:'Não olhe para baixo. Eu olhei. Eu não recomendo.',
 a:['Entrega expressa nas nuvens! Pip, mensageiro dos ventos. Você é o herói da lenda, certo?'],c2:[['Sou só alguém procurando a irmã.','Ainda mais bonito! Heróis demais querem glória, poucos querem alguém.'],['Depende de qual lenda.','Aquela em que você abre o céu quebrado. Boa, hein?']],z:['Zéfiro, Regente dos Ventos, parou de soprar. As ilhas começaram a cair uma por uma.','Colete os avisos que o vento deixou presos nas torres e derrote os gárgulas que travam a ponte.'],
 l1:['Aviso do vento','«A flor de cristal de Lyra cresce no alto da Coroa da Tempestade. Quem a toca ouve o futuro.»','Lyra plantou uma flor para nós? Ou para ela mesma?'],l2:['Carta sem destinatário','Uma carta presa na torre: «Se eu não voltar, Zéfiro me contou onde o Imperador esconde o trono.»','O trono. Ela sabe onde fica... e foi mesmo assim.'],
 k:'Os elementais estão presos em fios roxos, como marionetes sem dono.',m:{a:['Os fios roxos descem da Coroa da Tempestade. Zéfiro virou o instrumento de quem puxa os fios.'],c2:[['Vou cortá-los, um por um.','Corte devagar. Cada fio segura uma ilha.'],['Vou direto até a Coroa.','Rápido, então. Eu sigo o vento atrás de você.']],z:['A Coroa fica no topo. Segure firme, o vento vai testar você.']},
 bi:['Titã das Tempestades|Ventos... meus ventos... voltem para mim...','Fagulha|Ele luta para respirar! Os fios roxos o sufocam!'],bo:['Narração|Os raios se acalmam e o céu se abre em azul limpo. As ilhas voltam a subir devagar.','Zéfiro|Respirei de novo depois de séculos. Leve o fragmento, {h}, e a flor de Lyra.','Zéfiro|Ignar, no vulcão, sabe de onde vem a coroa do Imperador. Ele não vai gostar de contar.'],nx:'Vulcão Infernal'},
{n:'Kuro',x:90,y:-50,c:'#c8502a',h:'#111',em:'🌋',p:'O ar queima os pulmões. Rios de lava desenham caminhos que não existiam ontem.',pf:'Quente demais até para uma fagulha. Fique perto de mim.',
 a:['Mais um aventureiro de sapato frio! Eu sou Kuro, ferreiro. Se vai entrar no vulcão, antes ouça.'],c2:[['Quero falar com Ignar.','Ignar não fala. Ele forja, e cada lâmina conta uma verdade.'],['Qual o perigo aqui?','Tudo. Mas o pior é o silêncio da forja antiga.']],z:['A forja antiga produz algo que não é arma nem ferramenta: uma coroa roxa, forjada em segredo.','Ache as peças da coroa que o Vazio espalhou e limpe os cinzeiros dos imps.'],
 l1:['Molde da coroa','Um molde de ferro em forma de coroa de espinhos: «Para o Rei que renunciou ao próprio nome.»','Um rei sem nome... o oitavo Regente apagado.'],l2:['Martelo do Rei','Um martelo com uma inscrição: «Forjei esta coroa a pedido do meu irmão. Perdão, Ignar.»','O Imperador era irmão de Ignar. Por isso Ignar nunca contou.'],
 k:'Os imps carregam brasas roxas no peito, restos da forja corrompida.',m:{a:['O martelo prova que a coroa nasceu aqui, pelas mãos de Ignar. A culpa o consome há mil anos.'],c2:[['A culpa não é só dele.','Dê isso a ele, com palavras. Talvez ouça.'],['Ele precisa responder pelo que forjou.','Justo. Mas responda com os olhos abertos, não com ódio.']],z:['O coração do vulcão é o fim da estrada. Respire e vá.']},
 bi:['Senhor das Chamas|A coroa... eu a forjei... eu... meu irmão... perdão...','Fagulha|Ele não ataca por maldade. Ataca porque não sabe parar de se punir!'],bo:['Narração|A lava se acalma e as chamas se tornam âmbar. Ignar se ajoelha, enfim sem peso nos ombros.','Ignar|Meu irmão pediu a coroa para salvar o mundo. Salvou-o... e se perdeu. Leve o fragmento, {h}.','Ignar|O trono dele fica na Borda do Vazio. Lyra está lá. Ela escolheu ir.'],nx:'Abismo Cósmico'},
{n:'Astra',x:90,y:-50,c:'#7a5ad8',h:'#e8e8ff',em:'🌌',p:'Não há chão, só estrelas mortas e uma estrada de luz. Aqui o mapa acaba.',pf:'Aqui o mundo dobra. Siga a luz, {h}. Eu estou com você.',nb:1,
 a:['Eu sou Astra. Guardo a última estrada. Você chegou até aqui... Lyra também chegou.'],c2:[['Ela está bem?','Está inteira, mas o Vazio sussurra no ouvido dela todos os dias.'],['Ela foi capturada?','Não. Ela caminhou até o trono. Por vontade própria.']],z:['Sete Regentes caíram e se ergueram por você. Eles deixaram o que sabiam em cada fragmento.','Reúna as últimas memórias do Jardim das Estrelas Mortas. Só então o trono vai se mostrar.'],
 l1:['Estrela mortal','Uma estrela cintilando fraca: «O Imperador não nasceu do Vazio. Foi o Vazio que nasceu dele, depois de perder tudo.»','Então ele não é um monstro. É um luto que cresceu demais.'],l2:['Último bilhete de Lyra','«Irmão, se você ler isto, saiba: eu escolhi vir. Preciso olhar o Imperador de frente. Não me odeie.»','Ela sempre foi a corajosa. Eu quase esqueci.'],

const RK=[['F',0,'#9aa'],['E',500,'#8c8'],['D',1500,'#6c6'],['C',3000,'#4cf'],['B',5000,'#6af'],['A',8000,'#c8f'],['S',12000,'#fc4'],['SS',18000,'#f64']];
const EM=['🛡️','⚔️','🐉','🦅','🐺','🔥','❄️','⚡','🌿','🌙','☀️','💀','👑','🦁','🐍','🔮'];
const esc=t=>String(t==null?'':t).replace(/[<>&"']/g,'');
const score=()=>{try{return Math.round(LV()*100+(P.fin?5000:0)+wi*1500+(P.orbN||0)*40+(P.gold||0)/50+Object.keys((P.tr&&P.tr[TK()])||{}).length*25)}catch(e){return 0}};
const rk=v=>{let r=RK[0];for(const q of RK)if(v>=q[1])r=q;return r};
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
(function(){let i=lsg('aet_pid');if(!i){try{i=crypto.randomUUID().slice(0,8)}catch(e){i=Math.random().toString(36).slice(2,10)}lss('aet_pid',i)}window.AET_PID=i})();
const name=()=>{try{return (P.cu&&P.cu.nm)||'Herói'}catch(e){return 'Herói'}};
const L=()=>{try{return JSON.parse(lsg('aet_rank')||'[]')}catch(e){return[]}};
/* ===== TEMPORADAS MENSAIS =====
 Para mudar a recompensa de um mês, basta adicionar/editar uma linha aqui (chave 'AAAA-MM').
 Recompensas já ganhas ficam no COFRE (aet_vault), guardado à parte do jogo, e NUNCA são apagadas por atualizações. */
const SEASONS={
'2026-10':{n:'Dragão de Outubro',ic:'🐉',d:'Título lendário exclusivo de Outubro/2026'},
'2026-11':{n:'Fênix de Novembro',ic:'🔥',d:'Título lendário exclusivo de Novembro/2026'},
'2026-12':{n:'Estrela de Dezembro',ic:'🌟',d:'Título lendário exclusivo de Dezembro/2026'}};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const curM=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mLabel=m=>MESES[(+m.slice(5)-1)|0]+'/'+m.slice(0,4);
const GEN=[['Dragão','🐉'],['Fênix','🔥'],['Grifo','🦅'],['Hidra','🐍'],['Kraken','🦑'],['Unicórnio','🦄'],['Lobo Lunar','🐺'],['Titã','🏔️'],['Serpente Celeste','🌌'],['Golem Ancestral','🗿'],['Leviatã','🌊'],['Quimera','🦁'],['Carbúnculo','💎'],['Behemoth','🦣'],['Arauto Estelar','🌟'],['Senhor das Sombras','🌑']];
const seasonOf=m=>{if(SEASONS[m])return SEASONS[m];const k=((+m.slice(0,4))*12+(+m.slice(5)))%GEN.length,g=GEN[k];return{n:g[0]+' de '+MESES[(+m.slice(5)-1)|0]+' '+m.slice(0,4),ic:g[1],d:'Título lendário exclusivo de '+mLabel(m)}};
const left=()=>{const d=new Date(),ms=new Date(d.getFullYear(),d.getMonth()+1,1)-d,D=Math.floor(ms/864e5),H=Math.floor(ms%864e5/36e5),M=Math.floor(ms%36e5/6e4);return D>0?D+'d '+H+'h':H+'h '+M+'min'};
const V=()=>{try{const v=JSON.parse(lsg('aet_vault')||'[]');return Array.isArray(v)?v:[]}catch(e){return[]}};
const addV=r=>{const v=V();if(v.some(x=>x.m==r.m))return false;v.push(r);lss('aet_vault',JSON.stringify(v));return true};
const MS=()=>{try{return JSON.parse(lsg('aet_ms')||'null')}catch(e){return null}};
let pendingToast=null;const toasts=[];
/* ===== CONQUISTAS E TÍTULOS (permanentes: aet_ach / aet_title / aet_st) =====
 id:[título, ícone, descrição, teste(S)]  S = estatísticas do jogador. Adicione novas linhas à vontade; as já ganhas nunca somem. */
const rkI=v=>RK.findIndex(q=>q[0]==rk(v)[0]);
const ACH={
wl5:['Senhor do Mundo','🌐','Chegue ao Nível de Mundo 5',S=>S.wl>=5],
wl9:['Soberano de Aetheria','🌍','Chegue ao Nível de Mundo 9',S=>S.wl>=9],
gua:['Caçador de Guardiões','🛡️','Derrote um Guardião do Mundo',S=>S.gua>=1],
lux:['Olho de Ladrão','💎','Abra um baú luxuoso',S=>S.lux>=1],
asc:['Além do Limite','⬆️','Ascenda um herói ao máximo',S=>S.asc>=4],
amax:['Elenco Lendário','🌟','Toda a equipe no nível 60',S=>!!S.amax],
lv5:['Aprendiz','📘','Chegue ao nível 5',S=>S.lvl>=5],
lv10:['Aventureiro','🗡️','Chegue ao nível 10',S=>S.lvl>=10],
lv20:['Veterano de Guerra','⚔️','Chegue ao nível 20',S=>S.lvl>=20],
lv30:['Herói Lendário','🦸','Chegue ao nível 30',S=>S.lvl>=30],
w1:['Explorador','🧭','Avance para o 2º reino',S=>S.wi>=1],
w3:['Desbravador','🗺️','Avance para o 4º reino',S=>S.wi>=3],
w5:['Conquistador','🏰','Avance para o 6º reino',S=>S.wi>=5],
w7:['Senhor dos Reinos','👑','Alcance o 8º reino',S=>S.wi>=7],
fin:['Salvador de Aetheria','🌅','Termine a história',S=>S.fin],
gold:['Magnata','💰','Junte 5000 de ouro',S=>S.gold>=5000],
orb:['Caçador de Orbes','🔮','Colete 50 orbes',S=>S.orb>=50],
rkC:['Prata da Guilda','🥈','Alcance o rank C',S=>S.rk>=3],
rkA:['Ouro da Guilda','🥇','Alcance o rank A',S=>S.rk>=5],
rkS:['Estrela Suprema','🌟','Alcance o rank S',S=>S.rk>=6],
rkSS:['Mito Vivo','💫','Alcance o rank SS',S=>S.rk>=7],
gld:['Fundador de Guilda','🛡️','Crie uma guilda',S=>S.gld],
vt1:['Campeão do Mês','🏆','Ganhe sua primeira recompensa mensal',S=>S.vt>=1],
vt3:['Colecionador de Troféus','🎖️','Ganhe 3 recompensas mensais',S=>S.vt>=3],
cls10:['Versátil','🎭','Jogue com 10 classes diferentes',S=>S.cls>=10],
cls50:['Mestre de Todas as Artes','📜','Jogue com 50 classes diferentes',S=>S.cls>=50],
rac10:['Cosmopolita','🌍','Jogue com 10 raças diferentes',S=>S.rac>=10],
rac50:['Viajante dos Povos','🪐','Jogue com 50 raças diferentes',S=>S.rac>=50],
dm:['Mestra do Jogo (DM)','👑','Conquista exclusiva da Dungeon Master',()=>false,1]};
const SEC={'1aevg60':'dm'};
const hs=t=>{let x=5381;for(const c of String(t).trim().toLowerCase())x=((x<<5)+x+c.charCodeAt(0))>>>0;return x.toString(36)};
const AC=()=>{try{return JSON.parse(lsg('aet_ach')||'{}')||{}}catch(e){return{}}};
const STT=()=>{try{return JSON.parse(lsg('aet_st')||'{}')||{}}catch(e){return{}}};
const myTitle=()=>{const t=lsg('aet_title'),a=AC();return t&&a[t]&&ACH[t]?ACH[t][1]+' '+ACH[t][0]:''};
window.AET_TITLE=myTitle;
function unlock(id){const a=AC();if(a[id]||!ACH[id])return false;a[id]=Date.now();lss('aet_ach',JSON.stringify(a));if(!lsg('aet_title'))lss('aet_title',id);toasts.push('🎖️ Conquista: '+ACH[id][1]+' '+ACH[id][0]+'!');return true}
function checkAch(){try{const st=STT();if(typeof P!='undefined'&&P&&typeof P.c=='number'){st.c=st.c||[];st.r=st.r||[];if(!st.c.includes(P.c))st.c.push(P.c);if(!st.r.includes(P.r|0))st.r.push(P.r|0);st.lvl=Math.max(st.lvl||0,LV()|0);st.wi=Math.max(st.wi||0,wi|0);st.fin=st.fin||!!P.fin;st.gold=Math.max(st.gold||0,P.gold|0);st.orb=Math.max(st.orb||0,P.orbN|0);st.rk=Math.max(st.rk||0,rkI(score()));if(P.gn)st.gld=1;try{v7st(st)}catch(e){}}
lss('aet_st',JSON.stringify(st));const S={lvl:st.lvl|0,wi:st.wi|0,fin:!!st.fin,gold:st.gold|0,orb:st.orb|0,rk:st.rk|0,gld:!!st.gld,vt:V().length,cls:(st.c||[]).length,rac:(st.r||[]).length};
for(const id in ACH)if(!ACH[id][4]&&ACH[id][3](S))unlock(id)}catch(e){}}

(function settle(){const cm=curM(),ms=MS();if(ms&&ms.m&&ms.m!=cm&&ms.v>0){const sn=seasonOf(ms.m);if(addV({m:ms.m,n:sn.n,ic:sn.ic,d:sn.d,h:ms.n,c:ms.c||'',v:ms.v,t:Date.now()}))pendingToast=sn.ic+' Recompensa de '+mLabel(ms.m)+': '+sn.n+'!'}if(!ms||ms.m!=cm)lss('aet_ms',JSON.stringify({m:cm,n:'',v:0}))})();
function trackMonth(v){const cm=curM();let ms=MS();if(!ms||ms.m!=cm)ms={m:cm,n:'',v:0};if(v>ms.v){ms.v=v;ms.n=name();try{ms.c=(C[P.c]||[''])[0]}catch(e){}}lss('aet_ms',JSON.stringify(ms))}
function save(){try{const v=score();if(!v)return;const l=L().filter(x=>x.n!=name());const old=(L().find(x=>x.n==name())||{}).v||0;l.push({n:name(),v:Math.max(v,old),g:P.gn||'',e:P.ge||'',c:(C[P.c]||[''])[0]});l.sort((a,b)=>b.v-a.v);lss('aet_rank',JSON.stringify(l.slice(0,50)));trackMonth(v)}catch(e){}}
const box=document.createElement('div');box.style.cssText='position:fixed;inset:0;z-index:99998;background:#000c;display:none;align-items:center;justify-content:center;font-family:Georgia,serif;touch-action:auto';document.body.appendChild(box);
['keydown','keyup','keypress','mousedown','mouseup','touchstart','touchend','touchmove','pointerdown','pointerup','click'].forEach(ev=>box.addEventListener(ev,e=>e.stopPropagation()));
let wasPaused=false,isOpen=false;
function close(){box.style.display='none';box.innerHTML='';if(isOpen){isOpen=false;try{paused=wasPaused}catch(e){}}}
function open(){checkAch();const Q=(typeof P!='undefined'&&P)||{};if(!isOpen){isOpen=true;try{wasPaused=paused;if(state=='play')paused=true}catch(e){}}save();const v=score(),r=rk(v),i=RK.indexOf(r),nx=RK[i+1],pc=nx?Math.round((v-r[1])/(nx[1]-r[1])*100):100;const l=L();const gs={};l.forEach(x=>{if(x.g){const k=(x.e||'')+' '+x.g;gs[k]=(gs[k]||0)+x.v}});const cm=curM(),sn=seasonOf(cm),ms=MS()||{v:0},vt=V(),dd=(()=>{const d=new Date();return Math.ceil((new Date(d.getFullYear(),d.getMonth()+1,1)-d)/864e5)})();const gl=Object.entries(gs).sort((a,b)=>b[1]-a[1]).slice(0,5);
box.innerHTML='<div style="background:#10162b;border:2px solid '+r[2]+';border-radius:14px;padding:14px;width:min(92vw,420px);max-height:86vh;overflow:auto;color:#fff"><div style="text-align:center"><div style="font-size:52px;font-weight:900;color:'+r[2]+';text-shadow:0 0 14px '+r[2]+'">'+r[0]+'</div><div>'+esc(name())+' · '+v+' pts</div>'+(myTitle()?'<div style="color:#ffd36b;font-size:14px">«'+esc(myTitle())+'»</div>':'')+'<div style="height:8px;background:#333;border-radius:5px;margin:6px 0"><div style="height:8px;width:'+pc+'%;background:'+r[2]+';border-radius:5px"></div></div><div style="font-size:12px;opacity:.7">'+(nx?'Faltam '+(nx[1]-v)+' pts para o rank '+nx[0]:'Rank máximo!')+'</div></div><div style="margin:10px 0;padding:8px;border:1px solid #fc4;border-radius:10px;background:#fc41"><b>'+sn.ic+' Temporada '+mLabel(cm)+'</b><div style="font-size:13px">Prêmio: <b>'+esc(sn.n)+'</b> — '+esc(sn.d)+'</div><div style="font-size:12px;opacity:.8">Seu melhor este mês: '+(ms.v||0)+' pts'+(ms.n?' ('+esc(ms.n)+')':'')+' · termina em <b>'+left()+'</b>. O prêmio vai para o seu cofre quando o mês virar; depois disso, uma nova temporada com novo prêmio começa.</div></div><h3 style="margin:10px 0 4px">🏆 Ranking (seus heróis)</h3>'+l.slice(0,10).map((x,k)=>'<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #fff2"><span>'+(k+1)+'. '+esc(x.n)+(x.g?' ['+esc(x.e)+esc(x.g)+']':'')+'</span><b style="color:'+rk(x.v)[2]+'">'+rk(x.v)[0]+' · '+x.v+'</b></div>').join('')+'<h3 style="margin:10px 0 4px">🛡️ Guildas</h3>'+(gl.length?gl.map((x,k)=>'<div style="padding:3px 0">'+(k+1)+'. '+esc(x[0])+' — <b>'+x[1]+'</b></div>').join(''):'<div style="opacity:.7;font-size:13px">Nenhuma guilda ainda.</div>')+'<h3 style="margin:10px 0 4px">🎖️ Conquistas e títulos <small style="opacity:.6">('+Object.keys(AC()).length+'/'+Object.keys(ACH).length+')</small></h3><div style="font-size:11px;opacity:.7;margin-bottom:4px">Toque numa conquista ganha para usar o título.</div>'+Object.keys(ACH).filter(k=>AC()[k]||!ACH[k][4]).map(k=>{const on=!!AC()[k],cur=lsg('aet_title')==k;return '<button data-t="'+k+'" '+(on?'':'disabled')+' style="display:block;width:100%;text-align:left;margin:2px 0;padding:6px;border-radius:8px;border:1px solid '+(cur?'#fc4':'#444')+';background:'+(cur?'#fc42':'#0b1020')+';color:#fff;opacity:'+(on?1:.45)+'">'+(on?ACH[k][1]+' <b>'+esc(ACH[k][0])+'</b>'+(cur?' ✔':''):'🔒 ???')+'<br><small style="opacity:.75">'+esc(ACH[k][2])+'</small></button>'}).join('')+'<div style="display:flex;gap:6px;margin-top:6px"><input id="rkc" placeholder="🔑 Código secreto" style="flex:2;padding:8px;font-size:14px;border-radius:8px;border:1px solid #666;background:#0b1020;color:#fff;-webkit-user-select:text;user-select:text"><button id="rkcb" style="flex:1;padding:8px">Usar</button></div>'+'<h3 style="margin:10px 0 4px">🎁 Cofre de recompensas <small style="opacity:.6">(permanente)</small></h3>'+(vt.length?vt.slice().reverse().map(x=>'<div style="padding:3px 0;border-bottom:1px solid #fff2">'+esc(x.ic)+' <b>'+esc(x.n)+'</b> <small style="opacity:.7">'+mLabel(x.m)+' · '+esc(x.h)+' · '+x.v+' pts</small></div>').join(''):'<div style="opacity:.7;font-size:13px">Vazio. Termine um mês jogando para ganhar a primeira.</div>')+'<div style="display:flex;gap:6px;margin-top:6px"><button id="rkb" style="flex:1;padding:8px;font-size:13px">📤 Backup</button><button id="rkr" style="flex:1;padding:8px;font-size:13px">📥 Restaurar</button></div><div id="rkbx"></div><div id="rkw" style="margin-top:8px;display:flex;gap:6px"><button id="rkg" style="flex:1;padding:10px;font-size:15px">'+(state!='play'?'Entre numa partida para criar guilda':Q.gn?esc(Q.ge)+' '+esc(Q.gn)+' (editar)':'🛡️ Criar guilda')+'</button><button id="rkx" style="flex:1;padding:10px;font-size:15px">Fechar</button></div><div style="font-size:11px;opacity:.6;margin-top:6px">Seu jogo e sua guilda são só seus, salvos neste aparelho.</div></div>';
box.style.display='flex';document.getElementById('rkx').onclick=close;
document.querySelectorAll('button[data-t]').forEach(bt=>bt.onclick=()=>{if(bt.disabled)return;lss('aet_title',bt.dataset.t);open()});
const GIFT={'9qagfm':{n:'Presente de Aetheria',coin:60,gold:2000,pots:3}};
document.getElementById('rkcb').onclick=()=>{const hh=hs(document.getElementById('rkc').value),gf=GIFT[hh],e0=document.getElementById('rkc');if(gf){if(lsg('aet_gift_'+hh)){e0.value='';e0.placeholder='Código já usado';return}lss('aet_gift_'+hh,'1');if(P.pty)P.coin=(P.coin|0)+gf.coin;else P.gcp=(P.gcp|0)+gf.coin;P.gold=(P.gold|0)+gf.gold;P.pots=(P.pots|0)+gf.pots;try{save()}catch(_){}msg('🎁 '+gf.n+': +'+gf.coin+' Moedas Estelares, +'+gf.gold+' ouro, +'+gf.pots+' poções!');e0.value='';e0.placeholder='Código resgatado!';return}const id=SEC[hh];if(id){unlock(id);lss('aet_title',id);open()}else{const e=document.getElementById('rkc');e.value='';e.placeholder='Código inválido'}};
document.getElementById('rkb').onclick=()=>{const c=btoa(unescape(encodeURIComponent(JSON.stringify({v:V(),r:L(),a:AC(),s:STT(),t:lsg('aet_title')}))));document.getElementById('rkbx').innerHTML='<textarea readonly style="width:100%;box-sizing:border-box;height:70px;margin-top:6px;font-size:12px;-webkit-user-select:text;user-select:text">'+c+'</textarea><div style="font-size:11px;opacity:.7">Copie e guarde este código. Use Restaurar em outro aparelho/arquivo.</div>';const t=document.querySelector('#rkbx textarea');t.focus();t.select()};
document.getElementById('rkr').onclick=()=>{document.getElementById('rkbx').innerHTML='<textarea id="rkt" placeholder="Cole o código de backup" style="width:100%;box-sizing:border-box;height:70px;margin-top:6px;font-size:14px;-webkit-user-select:text;user-select:text"></textarea><button id="rkq" style="width:100%;padding:8px;margin-top:4px">Restaurar</button>';document.getElementById('rkq').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('rkt').value.trim()))));const cur=V();(o.v||[]).forEach(x=>{if(x&&x.m&&!cur.some(y=>y.m==x.m))cur.push(x)});lss('aet_vault',JSON.stringify(cur));const ac=Object.assign({},o.a||{},AC());lss('aet_ach',JSON.stringify(ac));if(o.t&&!lsg('aet_title'))lss('aet_title',o.t);const so=o.s||{},sc=STT();['lvl','wi','gold','orb','rk'].forEach(k=>sc[k]=Math.max(sc[k]|0,so[k]|0));sc.fin=sc.fin||so.fin;sc.gld=sc.gld||so.gld;sc.c=[...new Set([...(sc.c||[]),...(so.c||[])])];sc.r=[...new Set([...(sc.r||[]),...(so.r||[])])];lss('aet_st',JSON.stringify(sc));const rl=L();(o.r||[]).forEach(x=>{const e=rl.find(y=>y.n==x.n);if(!e)rl.push(x);else if(x.v>e.v)e.v=x.v});rl.sort((a,b)=>b.v-a.v);lss('aet_rank',JSON.stringify(rl.slice(0,50)));open()}catch(e){document.getElementById('rkq').textContent='Código inválido'}}};
document.getElementById('rkg').onclick=function(){if(state!='play')return;let em=Q.ge||EM[0];const w=document.getElementById('rkw');w.style.flexWrap='wrap';
w.innerHTML='<input id="rki" maxlength="16" placeholder="Nome da guilda" value="'+esc(Q.gn||'')+'" style="width:100%;box-sizing:border-box;padding:10px;font-size:16px;border-radius:8px;border:2px solid #fc4;background:#0b1020;color:#fff;-webkit-user-select:text;user-select:text">'+'<div id="rke" style="display:flex;flex-wrap:wrap;gap:4px;width:100%">'+EM.map(e=>'<button data-e="'+e+'" style="padding:6px;font-size:20px;border:2px solid '+(e==em?'#fc4':'#444')+';background:#0b1020;border-radius:8px">'+e+'</button>').join('')+'</div><button id="rko" style="flex:1;padding:10px;font-size:15px">Salvar</button><button id="rkd" style="flex:1;padding:10px;font-size:15px">'+(Q.gn?'Sair da guilda':'Cancelar')+'</button>';
document.querySelectorAll('#rke button').forEach(bt=>bt.onclick=()=>{em=bt.dataset.e;document.querySelectorAll('#rke button').forEach(x=>x.style.borderColor=x.dataset.e==em?'#fc4':'#444')});
document.getElementById('rko').onclick=()=>{const n=document.getElementById('rki').value.trim().slice(0,16);if(!n){document.getElementById('rki').style.borderColor='#f44';return}Q.gn=n;Q.ge=em;save();try{msg('🛡️ Guilda criada: '+em+' '+n)}catch(e){}open()};
document.getElementById('rkd').onclick=()=>{if(Q.gn){Q.gn='';Q.ge=''}save();open()};
setTimeout(()=>{try{document.getElementById('rki').focus()}catch(e){}},50)}}
const b=document.createElement('button');b.textContent='🏆';b.id='trophyBtn';b.style.cssText='position:fixed;left:6px;bottom:50px;z-index:60;padding:6px 10px;border-radius:10px;border:2px solid #fc4;background:#0b1020cc;color:#fff;font:bold 15px sans-serif;display:none';b.onclick=e=>{e.stopPropagation();open()};document.body.appendChild(b);
const tm=document.createElement('div');tm.id='seasonTag';tm.style.cssText='position:fixed;left:50px;bottom:54px;z-index:60;padding:4px 8px;border-radius:10px;background:#0b1020cc;border:1px solid #fc4;color:#ffd36b;font:bold 11px sans-serif;pointer-events:none;display:none';document.body.appendChild(tm);
let last='';setInterval(()=>{try{const sh=((state=='play'&&P||state=='title')&&!isOpen);tm.style.display=sh?'block':'none';if(sh){const sn=seasonOf(curM());tm.textContent=sn.ic+' '+sn.n+' · ⏳ '+left()}b.style.display=((state=='play'&&P||state=='title')&&!isOpen)?'block':'none';if(state=='play')checkAch();if(toasts.length&&state=='play'){try{msg(toasts.shift())}catch(e){}}if(pendingToast&&state=='play'){try{msg(pendingToast);pendingToast=null}catch(e){}}if(state!='play'||!P)return;const r=rk(score())[0];if(last&&r!=last&&RK.findIndex(q=>q[0]==r)>RK.findIndex(q=>q[0]==last)){msg('🏆 NOVO RANK: '+r+'!')}last=r;save()}catch(e){}},1500)})();
</script>
<script>/* v5: toque com resposta */
